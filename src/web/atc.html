<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ATC</title>
  <link rel="stylesheet" href="/assets/shared/font.css">
  <link rel="stylesheet" href="/assets/shared/theme.css">
  <link rel="stylesheet" href="/ext/atc/atc.css">
</head>
<body>
  <div class="atc-panel">
    <div class="atc-head">
      <span class="atc-hint">click row = select</span>
    </div>

    <div class="atc-range-bar">
      <span class="atc-range-label">RANGE</span>
      <div class="atc-range-btns" id="range-btns">
        <button class="atc-range-btn" data-range="5">5</button>
        <button class="atc-range-btn" data-range="10">10</button>
        <button class="atc-range-btn" data-range="25">25</button>
        <button class="atc-range-btn" data-range="50">50</button>
        <button class="atc-range-btn" data-range="100">100</button>
        <button class="atc-range-btn on" data-range="0">ALL</button>
      </div>
      <span class="atc-range-unit" id="range-unit">KM</span>
      <div class="atc-faction">
        <span class="atc-range-label">SHOW</span>
        <div class="atc-range-btns" id="faction-btns">
          <button class="atc-range-btn on" data-faction="all">ALL</button>
          <button class="atc-range-btn" data-faction="friendly">FRIENDLY</button>
          <button class="atc-range-btn" data-faction="enemy">ENEMY</button>
        </div>
      </div>
    </div>

    <div class="atc-list">
      <div class="atc-list-head">
        <span>CALLSIGN</span><span>STATUS</span><span>ALT</span><span>SPD</span><span>HDG</span><span>DIST</span><span>FUEL</span>
      </div>
      <div class="atc-list-scroll">
        <div class="atc-list-rows" id="rows"></div>
        <div class="atc-list-empty" id="list-empty">NO MATCHING CONTACTS</div>
      </div>
    </div>

    <div class="atc-footer">
      <div class="atc-selected" id="selected-line">SELECTED: <span class="atc-none">NONE</span></div>
      <label class="atc-track-label" id="track-label">
        <input type="checkbox" id="track-checkbox" disabled>
        TRACK ON MAP
      </label>
    </div>
  </div>

  <div class="mfd-empty" id="no-mission">
    <span class="mfd-empty-title">ATC</span>— NO SIGNAL —
  </div>

  <script type="module" src="/ext/atc/atc.js"></script>
</body>
</html>
